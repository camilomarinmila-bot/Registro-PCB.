<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventario de tarjetas PCB · Soluciones Verticales</title>
<style>
:root{/* PALETA CORPORATIVA Soluciones Verticales: morado #7e57c5, magenta #e31d93, rojo #ff4438, naranja #ff8300, amarillo #ffc600, lima #93d500, verde #00ce7c, azul #0071ce */--bg:#ffffff;--surface:#fff;--ink:#1c2432;--muted:#596378;--line:#e4e4ea;--head:#0071ce;--head-ink:#fff;--accent:#7e57c5;--accent-ink:#fff;--pink:#e31d93;
--ok:#00ce7c;--hi:#ff4438;--mid:#ff8300;--lo:#ffc600;color-scheme:light}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Poppins","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{background:var(--bg);color:var(--ink)}
.bar{max-width:1180px;margin:auto;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.nav{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:0;text-align:left}
.logo{display:block;height:48px;width:auto}.brand b{display:block;font-size:1.05rem;letter-spacing:.2px}.brand small{color:var(--muted);font-size:.8rem;font-weight:400}
main{max-width:1180px;margin:auto;padding:10px 24px 70px}
h1{font-size:1.9rem;margin:0 0 6px;line-height:1.15;letter-spacing:-.01em}.big{font-size:clamp(2.4rem,7vw,4.6rem);font-weight:600;margin:18px 0 12px;letter-spacing:-.03em}.big em{font-style:normal;color:var(--pink)}.sub{color:var(--muted);margin:0 0 20px;max-width:56ch}.hero{padding:26px 0 6px}
.lbl{display:flex;align-items:center;gap:16px;color:var(--muted);text-transform:uppercase;letter-spacing:.14em;font-size:.74rem;font-weight:600;margin:34px 0 18px}.lbl::before,.lbl::after{content:"";height:1px;background:var(--line);flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.cat{position:relative;background:var(--c);color:var(--t);border:0;border-radius:28px;padding:24px;min-height:210px;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;cursor:pointer;font:inherit;transition:transform .12s,box-shadow .12s}
.cat:hover,.cat:focus-visible{transform:translateY(-3px);box-shadow:0 8px 20px rgb(0 0 0/.12)}
.cat .n{font-size:3.6rem;font-weight:600;color:var(--t);line-height:1;margin-bottom:auto;padding-top:34px}.arrow{position:absolute;top:18px;right:18px;width:42px;height:42px;border-radius:50%;background:var(--t);color:var(--c);display:grid;place-items:center;font-size:1.2rem}.cat h2{margin:10px 0 2px;font-size:1.2rem;font-weight:600}.cat p{margin:0;color:var(--t);opacity:.85;font-size:.9rem}
.ok{--c:var(--ok);--t:#fff}.hi{--c:var(--hi);--t:#fff}.mid{--c:var(--mid);--t:#fff}.lo{--c:var(--lo);--t:#1c2432}
.termo{margin:0 0 18px}.termo .bar2{height:12px;border-radius:999px;background:linear-gradient(90deg,var(--hi),var(--mid),var(--lo),var(--ok))}.termo .lg{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:.78rem;color:var(--muted);font-weight:500}
h3.sec{margin:30px 0 10px;font-size:1.05rem}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip,.tab{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 18px;font:inherit;font-size:.92rem;cursor:pointer}
.tab[aria-selected="true"]{background:var(--head);color:var(--head-ink);border-color:var(--head)}
.tab i{font-style:normal;opacity:.75;margin-left:4px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.back{margin-top:10px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 11px;min-height:42px;max-width:100%}
.tools input{flex:1 1 240px;border-radius:999px;padding:9px 20px}
button.btn{font:inherit;font-weight:500;border-radius:999px;padding:9px 22px;min-height:42px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.est{display:inline-block;font-size:.8rem;font-weight:600;border-radius:999px;padding:2px 10px;margin-right:6px;border:1px solid transparent}
.e0{background:#eceef2;color:#3d4657}.e1{background:#dcecfb;color:#004f94}.e2{background:#fff0c2;color:#7a5a00}.e3{background:#d6f7e8;color:#00704a}
.dmg{margin:8px 0 0;display:flex;gap:6px;flex-wrap:wrap;align-items:center}.dch{display:inline-flex;align-items:center;gap:4px;font-size:.8rem;font-weight:500;border-radius:999px;padding:2px 4px 2px 10px;background:#fff1ef;border:1px solid #ffb9b2;color:#8a1d12}.dch button{border:0;background:none;color:inherit;cursor:pointer;font-size:1rem;line-height:1;padding:0 4px;border-radius:50%}.dnone{color:var(--muted);font-size:.85rem}.dlist{display:grid;gap:6px;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:14px;padding:10px}.f .dlist label{flex-direction:row;align-items:flex-start;gap:10px;color:var(--ink);font-size:.85rem}.f .dlist input{min-height:0;width:auto;margin-top:4px;flex:none}.dlist small{display:block;color:var(--muted);font-size:.78rem}
button.danger{color:var(--hi)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.list{display:grid;gap:12px}
.row{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:22px;padding:18px 22px;display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.row h4{margin:0;font-size:1.1rem;font-weight:600}.row p{margin:2px 0 8px;color:var(--muted)}
.tag,.qty{display:inline-block;font-size:.8rem;border-radius:999px;padding:2px 10px;background:color-mix(in srgb,var(--c) 20%,#fff);color:var(--ink);margin-right:6px;font-weight:600}
.qty{background:transparent;border:1px solid var(--line);color:var(--muted)}
.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.ctl label,.f label{display:flex;flex-direction:column;font-size:.78rem;color:var(--muted);gap:3px}
.ctl select{min-height:38px;padding:6px 8px}
.empty{text-align:center;color:var(--muted);padding:40px 10px;border:2px dashed var(--line);border-radius:12px}
dialog{border:0;border-radius:28px;padding:22px;width:min(480px,92vw);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgb(0 0 0/.5)}
.f{display:grid;gap:12px;margin:14px 0}.f label{font-size:.85rem}.f input,.f select{width:100%}
.acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.err{color:var(--hi);font-size:.88rem;min-height:1.2em;margin:0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--head);color:var(--head-ink);padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw}
#toast.on{opacity:1}
.foot{background:var(--ink);color:var(--head-ink);padding:34px 24px calc(34px + env(safe-area-inset-bottom,0px));border-radius:36px 36px 0 0}.foot>div{max-width:1180px;margin:auto;display:flex;gap:20px;flex-wrap:wrap;justify-content:space-between;align-items:center;font-size:.88rem}.foot p{margin:2px 0;opacity:.85}.foot .btn{background:transparent;color:inherit;border-color:rgb(255 255 255/.4)}
@media(max-width:640px){.bar{padding:12px 16px 4px}.nav{width:100%;flex-wrap:nowrap;overflow-x:auto;gap:8px;padding-bottom:6px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav .chip,.nav .btn{white-space:nowrap;flex:none;padding:7px 14px;font-size:.84rem;min-height:38px}
main{padding:0 16px 56px}.hero{padding:6px 0 0}.big{margin:6px 0 8px}.sub{font-size:.9rem;margin-bottom:14px}.lbl{margin:22px 0 14px}
.grid{grid-template-columns:1fr 1fr;gap:12px}.cat{min-height:158px;padding:16px;border-radius:22px}.cat .n{font-size:2.6rem;padding-top:30px}.cat h2{font-size:1rem}.cat p{font-size:.76rem}.arrow{width:34px;height:34px;top:12px;right:12px;font-size:1rem}
.hero .chips{flex-wrap:nowrap}.hero .chip{padding:7px 12px;font-size:.8rem;white-space:nowrap}.hero .tools{flex-wrap:nowrap}.hero .tools input{flex:1 1 auto;min-width:0;padding:9px 16px;font-size:.85rem}.hero .tools .btn{flex:none;padding:9px 16px}
.row{padding:14px 16px}.ctl{width:100%}.ctl label{flex:1 1 40%}.ctl select{width:100%}}
</style></head>

const ESTADOS=['Sin revisar','Revisada','En reparación','Reparada'];
const DANOS=[
{n:'Electricidad estática (ESD)',d:'Una descarga electrostática puede quemar o deteriorar componentes electrónicos, incluso sin que el daño sea visible.'},
{n:'Humedad',d:'Puede provocar corrosión en pistas, terminales y componentes, además de favorecer cortocircuitos.'},

const DN=DANOS.map(x=>x.n);
const MODS=[1,2,3,4,5,6].map(n=>'Módulo '+n);
/* Distribución de ejemplo: solo 15 unidades Reparadas; las demás se reparten entre prioridad alta, media y baja (proporción del Excel) y las unidades de una misma referencia quedan en categorías distintas */
const N_REP=15;
const seed=()=>{
 let a=12345;const rnd=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
 const U=RAW.flatMap((r,i)=>Array.from({length:r[2]},(_,u)=>({id:'p'+(i+1)+'_'+(u+1),codigo:r[0],unidad:u+1,desc:r[1],tipo:TIPOS[r[3]],modulo:MODS[i%MODS.length],_i:i,_u:u,_c:r[4]})));
 const rep=new Set();U.filter(x=>x._c==='reparadas'&&x._u===0).slice(0,N_REP).forEach(x=>rep.add(x.id));
 const rest=U.filter(x=>!rep.has(x.id));for(let k=rest.length-1;k>0;k--){const j=Math.floor(rnd()*(k+1));[rest[k],rest[j]]=[rest[j],rest[k]]}
 const w={alta:401,media:657,baja:181},tw=1239,nA=Math.round(rest.length*w.alta/tw),nM=Math.round(rest.length*w.media/tw);
 rest.forEach((x,k)=>{x.cat=k<nA?'alta':k<nA+nM?'media':'baja'});
 return U.map(x=>{const {_i,_u,_c,...b}=x;const i=_i,u=_u;return rep.has(x.id)?{...b,cat:'reparadas',estado:'Reparada',danos:[]}:{...b,cat:x.cat,estado:ESTADOS[(i*7+3+u)%3],danos:[...new Set([DN[(i*5+2+u)%10],...((i+u)%3===0?[DN[(i*3+1+u)%10]]:[])])]}})};
const fix=l=>l.map(p=>{const q={estado:p.cat==='reparadas'?'Reparada':'Sin revisar',...p};if(!Array.isArray(q.danos))q.danos=q.dano&&q.cat!=='reparadas'?[DN[(parseInt(String(q.id).replace(/\D/g,''))||0)%10]]:[];delete q.dano;delete q.cant;return q});

/* ===== Capa de datos: hoy localStorage; para una BD, reemplazar solo este objeto por llamadas fetch() a la API ===== */
const KEY='sv_pcb_v4', V2='sv_pcb_v2', OLD='sv_pcb_v1', mem={};
const store={get(k=KEY){try{return localStorage.getItem(k)}catch(e){return mem[k]||null}},set(v){try{localStorage.setItem(KEY,v)}catch(e){mem[KEY]=v}}};
/* Migración: la versión anterior guardaba una fila por referencia con "cant"; ahora cada unidad es su propio registro */
const expand=l=>l.flatMap(p=>{if(p.unidad)return[p];const n=Math.max(1,+p.cant||1);const {cant,...b}=p;return Array.from({length:n},(_,u)=>({...b,id:p.id+'_'+(u+1),unidad:u+1,danos:[...(b.danos||[])]}))});
const Repo={
 async list(){const s=store.get();if(s){try{return fix(JSON.parse(s))}catch(e){}}
  const d=seed();store.set(JSON.stringify(d));return d},
 async _save(l){store.set(JSON.stringify(l));return l},
 async createMany(item,n){const l=await this.list();const mx=Math.max(0,...l.filter(x=>norm(x.codigo)===norm(item.codigo)).map(x=>x.unidad||0));const t=Date.now();
  const nu=Array.from({length:n},(_,u)=>({...item,danos:[...item.danos],id:'p'+t+'_'+u,unidad:mx+u+1}));await this._save([...nu,...l]);return nu},
 async update(id,patch){const l=await this.list();const i=l.findIndex(x=>x.id===id);if(i<0)return null;Object.assign(l[i],patch);await this._save(l);return l[i]},
 async remove(id){const l=(await this.list()).filter(x=>x.id!==id);await this._save(l)},
 async reset(){const d=seed();await this._save(d);return d}
};

let DB=[],S={view:'inicio',q:'',mod:'',lim:60},refCount={};
const LIM=60;
const VIEWS=['inicio','referencias','todas',...Object.keys(CATS)];
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const opts=(arr,sel,val=x=>x,lab=x=>x)=>arr.map(x=>`<option value="${esc(val(x))}"${val(x)===sel?' selected':''}>${esc(lab(x))}</option>`).join('');
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)};
function go(v,keep){S.view=v;S.lim=LIM;if(!keep){S.q='';S.mod=''}render();window.scrollTo(0,0);try{location.hash=v}catch(e){}}
addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(VIEWS.includes(v)&&v!==S.view){S.view=v;render()}});

function list(){

  .map(([k,n,c])=>`<button class="tab" role="tab" aria-selected="${S.view===k}" data-go="${k}" data-keep="1">${n}<i>${c}</i></button>`).join('');

function results(){
 const q=norm(S.q.trim());
 const l=DB.filter(p=>(S.view==='todas'||p.cat===S.view)&&(!S.mod||p.modulo===S.mod)&&(!q||norm(p.codigo+'-'+p.unidad).includes(q)||norm(p.codigo).includes(q)||norm(p.desc).includes(q)||norm('pcb '+p.codigo).includes(q)));
 $('#cnt').textContent=`${l.length} ${l.length===1?'unidad':'unidades'} · ${new Set(l.map(p=>p.codigo)).size} ${new Set(l.map(p=>p.codigo)).size===1?'referencia':'referencias'}`;
 refCount={};DB.forEach(p=>refCount[p.codigo]=(refCount[p.codigo]||0)+1);
 const vis=l.slice(0,S.lim);
 $('#res').innerHTML=l.length?vis.map(p=>`<article class="row ${CATS[p.cat].c}" data-id="${p.id}">
  <div><h4>PCB ${esc(p.codigo)} · Unidad ${p.unidad} — ${esc(p.modulo)}</h4><p>${esc(p.desc)}</p><span class="tag">${esc(p.tipo)}</span><span class="qty">${refCount[p.codigo]} uds. de esta referencia</span>
  <p class="dmg"><span class="est e${ESTADOS.indexOf(p.estado)}">${esc(p.estado)}</span>${p.danos.length?p.danos.map(n=>`<span class="dch" title="${esc((DANOS.find(x=>x.n===n)||{}).d||'')}">${esc(n)}<button data-act="deldano" data-d="${esc(n)}" aria-label="Quitar ${esc(n)}">×</button></span>`).join(''):'<span class="dnone">Sin daño registrado</span>'}</p></div>
  <div class="ctl"><label>Categoría<select data-act="cat">${opts(Object.keys(CATS),p.cat,x=>x,x=>CATS[x].n)}</select></label>
  <label>Agregar daño<select data-act="adddano"><option value="">+ Elegir daño…</option>${opts(DN.filter(n=>!p.danos.includes(n)))}</select></label>
  <label>Estado<select data-act="estado">${opts(ESTADOS,p.estado)}</select></label>
  <label>Módulo<select data-act="mod">${opts(MODS,p.modulo)}</select></label>
  <button class="btn" data-act="edit">Editar</button><button class="btn danger" data-act="del">Eliminar</button></div></article>`).join('')+(l.length>vis.length?`<div style="text-align:center;margin:10px 0"><button class="btn" data-act="more">Mostrar más (${l.length-vis.length} restantes)</button></div>`:'')
  :'<div class="empty">No hay unidades que coincidan con la búsqueda o los filtros.</div>';
}
function refs(){
 const m={};DB.forEach(p=>{const r=m[p.codigo]||(m[p.codigo]={codigo:p.codigo,desc:p.desc,n:0,c:{}});r.n++;r.c[p.cat]=(r.c[p.cat]||0)+1});
 const rows=Object.values(m).sort((a,b)=>a.codigo<b.codigo?-1:1);
 $('#app').innerHTML=`<div class="lbl">Referencias</div><button class="btn back" data-go="inicio">← Inicio</button><h1 style="margin-top:18px">${rows.length} referencias · ${DB.length.toLocaleString('es-CO')} unidades</h1><p class="sub">Cada referencia agrupa sus unidades, pero cada unidad tiene su propio seguimiento. Pulsa "Ver unidades" para abrirlas una por una.</p>
 <div class="list">${rows.map(r=>`<article class="row"><div><h4>PCB ${esc(r.codigo)}</h4><p>${esc(r.desc)}</p><span class="qty"><b>${r.n}</b> ${r.n===1?'unidad':'unidades'}</span>${Object.entries(CATS).filter(([k])=>r.c[k]).map(([k,c])=>`<span class="tag ${c.c}">${c.n}: ${r.c[k]}</span>`).join('')}</div><button class="btn" data-ref="${esc(r.codigo)}">Ver unidades</button></article>`).join('')}</div>`;
}
function render(){S.view==='inicio'?home():S.view==='referencias'?refs():list();const v=$('#ver');if(v)v.textContent=`Versión 15 · ${new Set(DB.map(p=>p.codigo)).size} referencias · ${DB.length} unidades`;document.title='Inventario PCB · Soluciones Verticales'}

/* ===== Formulario (registrar / editar) y confirmación ===== */
function form(p){
 const n=!p;p=p||{codigo:'',desc:'',estado:'Sin revisar',danos:[],tipo:TIPOS[0],cat:CATS[S.view]?S.view:'alta',modulo:S.mod||MODS[0]};
 const d=$('#dlg');
 d.innerHTML=`<h2 style="margin:0">${n?'Registrar tarjeta':'Editar tarjeta'}</h2><div class="f">
 <label>Número de PCB<input id="f1" value="${esc(p.codigo)}" placeholder="Ej. 020105"></label>
 <label>Referencia / descripción<input id="f2" value="${esc(p.desc)}" placeholder="Ej. PCB DOR-123C"></label>
 ${n?'<label>Cantidad de unidades (cada una se registra y se sigue por separado)<input id="f3" type="number" min="1" max="500" value="1"></label>':`<p class="sub" style="margin:0">Unidad ${p.unidad} de esta referencia</p>`}
 <label>Tipo de tarjeta<select id="f4">${opts(TIPOS,p.tipo)}</select></label>
 <label>Categoría<select id="f5">${opts(Object.keys(CATS),p.cat,x=>x,x=>CATS[x].n)}</select></label>
 <label>Estado de la tarjeta<select id="f7">${opts(ESTADOS,p.estado)}</select></label>
 <label>Daños que presenta (opcional)</label><div class="dlist">${DANOS.map(x=>`<label><input type="checkbox" class="dchk" value="${esc(x.n)}"${(p.danos||[]).includes(x.n)?' checked':''}><span><b>${esc(x.n)}</b><small>${esc(x.d)}</small></span></label>`).join('')}</div>
 <label>Módulo donde está guardada<select id="f6">${opts(MODS,p.modulo)}</select></label>
 <p class="err" id="ferr"></p></div><div class="acts"><button class="btn" id="fc">Cancelar</button><button class="btn pri" id="fs">Guardar</button></div>`;
 d.showModal();$('#fc').onclick=()=>d.close();
 $('#fs').onclick=async()=>{
  const v={codigo:$('#f1').value.trim(),desc:$('#f2').value.trim(),tipo:$('#f4').value,cat:$('#f5').value,modulo:$('#f6').value,estado:$('#f7').value,danos:[...document.querySelectorAll('.dchk:checked')].map(c=>c.value)};
  if(!v.codigo||!v.desc){$('#ferr').textContent='El número y la referencia son obligatorios.';return}
  const cn=n?Math.min(500,Math.max(1,parseInt($('#f3').value)||1)):0;
  if(n){DB.unshift(...await Repo.createMany(v,cn))}else{Object.assign(DB.find(x=>x.id===p.id),await Repo.update(p.id,v))}
  d.close();render();toast(n?(cn===1?'Unidad registrada':cn+' unidades registradas'):'Cambios guardados')};
}
function ask(msg,okLabel,fn){const d=$('#dlg');
 d.innerHTML=`<h2 style="margin:0">¿Confirmar?</h2><p>${esc(msg)}</p><div class="acts"><button class="btn" id="fc">Cancelar</button><button class="btn pri" id="fs">${okLabel}</button></div>`;
 d.showModal();$('#fc').onclick=()=>d.close();$('#fs').onclick=async()=>{await fn();d.close()}}

/* ===== Eventos ===== */
document.addEventListener('click',async e=>{
 const g=e.target.closest('[data-go]');if(g){go(g.dataset.go,!!g.dataset.keep);return}
 const rf=e.target.closest('[data-ref]');if(rf){S.q=rf.dataset.ref;S.mod='';S.lim=LIM;go('todas',true);return}
 const m=e.target.closest('[data-mod]');if(m){S.mod=m.dataset.mod;S.q='';go('todas',true);return}
 const b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT')return;
 const id=b.closest('.row')?.dataset.id,p=DB.find(x=>x.id===id);
 if(b.dataset.act==='more'){S.lim+=LIM;const y=scrollY;results();scrollTo(0,y);return}
 if(b.dataset.act==='new')form();
 if(b.dataset.act==='edit')form(p);
 if(b.dataset.act==='deldano'){const nd=p.danos.filter(x=>x!==b.dataset.d);Object.assign(p,await Repo.update(id,{danos:nd}));toast('Daño quitado');const y=scrollY;render();scrollTo(0,y)}
 if(b.dataset.act==='del')ask(`Se eliminará la unidad ${p.unidad} de la PCB ${p.codigo} (${p.desc}). Esta acción no se puede deshacer.`,'Eliminar',async()=>{await Repo.remove(id);DB=DB.filter(x=>x.id!==id);render();toast('Unidad eliminada')});
 if(b.dataset.act==='reset')ask('Se borrarán todos los cambios y se cargarán de nuevo los datos de ejemplo.','Restablecer',async()=>{DB=await Repo.reset();render();toast('Datos restablecidos')});
});
document.addEventListener('change',async e=>{
 const s=e.target;if(s.id==='fm'){S.mod=s.value;S.lim=LIM;results();return}
 if(s.dataset.act==='adddano'){if(!s.value)return;const id=s.closest('.row').dataset.id,p=DB.find(x=>x.id===id);Object.assign(p,await Repo.update(id,{danos:[...p.danos,s.value]}));toast('Daño agregado');const y=scrollY;render();scrollTo(0,y);return}
 if(['cat','mod','estado'].includes(s.dataset.act)){
  const id=s.closest('.row').dataset.id,f={cat:'cat',mod:'modulo',estado:'estado'}[s.dataset.act];
  Object.assign(DB.find(x=>x.id===id),await Repo.update(id,{[f]:s.value}));
  toast({cat:'Categoría actualizada',modulo:'Módulo actualizado',estado:'Estado actualizado'}[f]);
  const y=scrollY;render();scrollTo(0,y)}
});
document.addEventListener('input',e=>{
 if(e.target.id==='q'){S.q=e.target.value;S.lim=LIM;results()}
 if(e.target.id==='q0'&&e.target.value){S.q=e.target.value;S.view='todas';S.lim=LIM;render();const q=$('#q');q.focus();q.setSelectionRange(q.value.length,q.value.length)}
});

(async()=>{DB=await Repo.list();const v=location.hash.slice(1);if(VIEWS.includes(v))S.view=v;render()})();
</script></body></html>
